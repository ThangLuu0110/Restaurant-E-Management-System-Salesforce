<template>
  <main class="main">
    <div class="title-row">
      <h1 class="title-row__heading">{title}</h1>
      <div class="cart-area" onclick={handleCartAreaClick}>
        <button
          type="button"
          class="cart-button"
          aria-label={cartAriaLabel}
          aria-haspopup="dialog"
          aria-expanded={cartExpanded}
          onclick={handleCartToggle}
        >
          <svg
            class="cart-button__icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="square"
            aria-hidden="true"
          >
            <circle cx="8" cy="21" r="1"></circle>
            <circle cx="19" cy="21" r="1"></circle>
            <path
              d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"
            ></path>
          </svg>
          <template lwc:if={hasCartItems}>
            <span class="cart-button__badge">{cartCount}</span>
          </template>
        </button>
        <template lwc:if={isCartOpen}>
          <c-cart-dropdown
            class="cart-area__dropdown"
            items={cartItems}
            onquantitychange={handleQuantityChange}
            onremove={handleRemoveItem}
            onclear={handleClearCart}
          ></c-cart-dropdown>
        </template>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar__chips">
        <template for:each={categoryChips} for:item="chip">
          <button
            key={chip.value}
            type="button"
            class={chip.className}
            aria-pressed={chip.ariaPressed}
            data-value={chip.value}
            onclick={handleCategoryClick}
          >
            {chip.label}
          </button>
        </template>
      </div>
      <div class="search">
        <svg
          class="search__icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          type="text"
          class="search__input"
          placeholder="Search for food..."
          aria-label="Search for food"
          oninput={handleSearchChange}
        />
      </div>
    </div>

    <template lwc:if={hasNoResults}>
      <p class="empty-state">Không tìm thấy món phù hợp</p>
    </template>

    <div class="dish-grid">
      <template for:each={filteredItems} for:item="item">
        <article class="dish-card" key={item.Id}>
          <div class="dish-card__image">
            <template lwc:if={item.imageSrc}>
              <img
                src={item.imageSrc}
                alt={item.Name}
                class="dish-card__image-img"
              />
            </template>
          </div>
          <div class="dish-card__body">
            <div class="dish-card__name">{item.Name}</div>
            <div class="dish-card__price">{item.priceLabel}</div>
            <div class="dish-card__spacer"></div>
            <button
              type="button"
              class="dish-card__add"
              data-id={item.Id}
              onclick={handleAddToCart}
            >
              <span>Thêm vào giỏ hàng</span>
              <span class="dish-card__add-icon">+</span>
            </button>
          </div>
        </article>
      </template>
    </div>

    <div class="toast-region" aria-live="polite">
      <template lwc:if={hasToast}>
        <div class="toast" role="status">{toastMessage}</div>
      </template>
    </div>
  </main>
</template>
